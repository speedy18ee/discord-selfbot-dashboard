services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MYSQL_HOST=mysql-24ffdf5c-vishnureddy43938-2e52.c.aivencloud.com
